[package]
name = "loqui-g2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GPL-free English grapheme-to-phoneme for Kokoro: misaki lexicons plus an embedded neural fallback."
# The embedded G2P weights are data, not code; keep them in the package.
include = ["src/**", "data/**", "Cargo.toml", "README.md"]

[lints]
workspace = true

[dependencies]
# Lexicon lookup, POS tagging (heteronyms), morphology and number expansion:
# a Rust port of hexgrad/misaki. MIT. `default-features = false` is the whole
# point of this crate: its default `espeak` feature links espeak-ng (GPL-3.0),
# which must never enter a default build. We supply the out-of-vocabulary
# fallback ourselves (see `neural.rs`).
misaki-rs = { version = "0.6", default-features = false }

# Parses the safetensors header of the embedded G2P model. Already in the
# graph through misaki-rs, so it adds no lockfile nodes.
serde_json = "1"

# `erf` for the exact GELU the BART checkpoint was trained with. `std` has no
# `erf`, and the tanh approximation drifts enough to flip argmax on a few
# words. Pure Rust, MIT/Apache.
libm = "0.2"

thiserror = "2"

[features]
# Links eSpeak NG through misaki-rs as the out-of-vocabulary fallback.
# GPL-3.0: a binary built with this feature is GPL. Off by default.
espeak = ["misaki-rs/espeak"]

[dev-dependencies]
# Pins the embedded checkpoints and lexicons to the exact upstream bytes.
sha2 = "0.10"
